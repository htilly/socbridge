name: Build and publish image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: End-to-end (passkeys, MCP auth, findings API)
        run: npm run test:e2e

  image:
    name: Build and push image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Image name and tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT="${GITHUB_SHA:0:7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$IMAGE:main,$IMAGE:main-$SHORT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: socbridge:smoke
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test before anything is published
        run: |
          set -euo pipefail
          IMAGE=socbridge:smoke
          docker run -d --name smoke \
            -e PUBLIC_URL=https://socbridge.example.com -e TLS_MODE=builtin \
            -e CONFIG_ENCRYPTION_KEY="$(openssl rand -hex 32)" "$IMAGE"
          for _ in $(seq 1 30); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$STATUS" = healthy ] && break
            sleep 2
          done
          docker logs smoke | tail -5
          [ "$STATUS" = healthy ] || { echo "::error::container never became healthy ($STATUS)"; exit 1; }
          BUILD=$(docker exec smoke sh -c 'echo "$BUILD_SHA"')
          [ "$BUILD" = "$GITHUB_SHA" ] || { echo "::error::BUILD_SHA in image is '$BUILD'"; exit 1; }
          docker rm -f smoke
      - name: Push the tested image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
